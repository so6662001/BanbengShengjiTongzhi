spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:notify_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  data:
    redis:
      host: localhost
      port: 6399   # 故意指向不存在端口，验证未读缓存等对 Redis 不可用的优雅降级

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
